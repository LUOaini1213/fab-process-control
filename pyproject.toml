[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabpc"
version = "0.1.0"
description = "Semiconductor process-control portfolio: SPC, PCA-based FDC, DOE, run-to-run EWMA control, FMEA/8D"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "pandas==2.2.2",
    "scikit-learn==1.5.1",
    "matplotlib==3.9.2",
    "threadpoolctl==3.7.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.2"]

[project.scripts]
fabpc = "fabpc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
